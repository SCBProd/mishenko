name: Publish portfolio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ['pages build and deployment']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: portfolio-pages
  cancel-in-progress: false
jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.source.outputs.publish }}
    steps:
      # Branch-based Pages must finish before the prepared portfolio is deployed.
      # With Actions as the source, publish directly on push instead.
      - name: Select the publication trigger for the configured Pages source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          mode=$(gh api "repos/$GH_REPO/pages" --jq '.build_type')
          publish=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]] ||
             [[ "$EVENT_NAME" == "push" && "$mode" == "workflow" ]] ||
             [[ "$EVENT_NAME" == "workflow_run" && "$mode" == "legacy" ]]; then
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Pages source: $mode; event: $EVENT_NAME; publish: $publish"
  deploy:
    needs: route
    if: needs.route.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare static portfolio from the shared source
        run: node scripts/prepare-legacy.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public/legacy
          include-hidden-files: true
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
