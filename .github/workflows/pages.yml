name: Publish portfolio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: portfolio-pages
  cancel-in-progress: false
jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      publish: ${{ steps.source.outputs.publish }}
    steps:
      # Branch-based Pages must finish before the prepared portfolio is deployed.
      # With Actions as the source, publish directly on push instead.
      - name: Select the publication trigger for the configured Pages source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          mode=$(gh api "repos/$GH_REPO/pages" --jq '.build_type')
          if [[ "$mode" == "legacy" ]]; then
            completed=false
            for attempt in $(seq 1 120); do
              status=$(gh api "repos/$GH_REPO/actions/runs?head_sha=$COMMIT_SHA&per_page=100" \
                --jq '[.workflow_runs[] | select(.name == "pages build and deployment")][0].status // "pending"')
              echo "Built-in Pages publication: $status (attempt $attempt)"
              if [[ "$status" == "completed" ]]; then
                completed=true
                break
              fi
              sleep 10
            done
            if [[ "$completed" != "true" ]]; then
              echo "Built-in Pages publication did not finish; refusing a competing deployment."
              exit 1
            fi
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "Pages source: $mode; ready to publish prepared portfolio"
  deploy:
    needs: route
    if: needs.route.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare static portfolio from the shared source
        run: node scripts/prepare-legacy.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public/legacy
          include-hidden-files: true
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
