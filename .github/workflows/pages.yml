name: Publish portfolio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: portfolio-pages
  cancel-in-progress: true
jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      publish: ${{ steps.source.outputs.publish }}
    steps:
      # Branch-based Pages must finish before the prepared portfolio is deployed.
      # With Actions as the source, publish directly on push instead.
      - name: Select the publication trigger for the configured Pages source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          mode=$(gh api "repos/$GH_REPO/pages" --jq '.build_type')
          if [[ "$mode" == "legacy" ]]; then
            # Release stale Pages deployments before the built-in branch publisher runs.
            for stale in $(gh api "repos/$GH_REPO/deployments?environment=github-pages&per_page=5" --jq '.[].sha' | sort -u); do
              if [[ "$stale" != "$COMMIT_SHA" ]]; then
                gh api --method POST "repos/$GH_REPO/pages/deployments/$stale/cancel" >/dev/null 2>&1 || true
              fi
            done
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Branch-based Pages publishes the filtered source site. Skipping a competing deployment."
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "Pages source: $mode; ready to publish prepared portfolio"
  deploy:
    needs: route
    if: needs.route.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify photography references and navigation
        run: |
          node scripts/check-photography-integrity.cjs
          node scripts/check-photography-navigation.cjs
      - name: Prepare static portfolio from the shared source
        run: node scripts/prepare-legacy.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public/legacy
          include-hidden-files: true
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
